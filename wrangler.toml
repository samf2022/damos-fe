#:schema node_modules/wrangler/config-schema.json
name = "damos-fe"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_als"]
main = ".svelte-kit/cloudflare/_worker.js"

# Static assets built by adapter-cloudflare, served by the Worker through the ASSETS binding.
[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = true

[vars]
APP_URL = "https://damos-fe.samf0794.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "damos-fe-db"
database_id = "37a1c91d-0775-4886-9dd8-9a3be7d3050f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "damos-fe-files"
